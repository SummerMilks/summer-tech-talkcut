<!doctype html>
<!-- 由 render.py 按项目生成 work/stage.html，不要直接打开本模板 -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "DeYi"; src: url("{{FONT_URL}}"); }
:root {
  --bg: #05070d; --ink: #f4f7ff; --mute: rgba(226,232,255,.62);
  --cyan: #4cc9ff; --violet: #9b8cff; --mint: #3ee6a8; --red: #ff6b7a; --amber: #ffc85a;
  --glass: rgba(16,20,34,.62); --line: rgba(255,255,255,.12);
  --cn: "PingFang SC", "Hiragino Sans GB", sans-serif;
  --en: "SF Pro Display", -apple-system, "Helvetica Neue", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); font-family: var(--cn); color: var(--ink); }
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; }

html.overlay, html.overlay body, html.overlay #stage { background: transparent; }
html.overlay #aroll, html.overlay .subs, html.overlay .grain { display: none; }
/* 口播 */
#aroll { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; transform-origin: 50% 42%; }

/* 全屏场景 */
.scene { position: absolute; inset: 0; overflow: hidden; background: #05070d; transform-origin: 50% 50%; }
.scene .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
.scene-tint { position: absolute; inset: 0;
  background: radial-gradient(120% 90% at 50% 40%, rgba(10,16,34,.15) 0%, rgba(4,6,14,.78) 75%, rgba(3,4,10,.95) 100%); }
.scene-tint.cool { background: radial-gradient(120% 90% at 50% 40%, rgba(20,60,120,.18) 0%, rgba(4,8,20,.8) 70%, rgba(2,4,10,.96) 100%); }
.scene-tint.light { background: linear-gradient(180deg, rgba(4,6,14,.2) 0%, rgba(4,6,14,.05) 40%, rgba(4,6,14,.65) 100%); }
.grid { position: absolute; inset: -2px; opacity: .22;
  background-image: linear-gradient(rgba(140,180,255,.16) 1px, transparent 1px), linear-gradient(90deg, rgba(140,180,255,.16) 1px, transparent 1px);
  background-size: 80px 80px; mask-image: radial-gradient(70% 70% at 50% 50%, #000 30%, transparent 100%); }
.scene-inner { position: absolute; inset: 0; }
.scene-inner > *, .panel > *, .ov > * { position: absolute; }

.flash { position: absolute; inset: 0; background: radial-gradient(80% 80% at 50% 50%, #e8f6ff 0%, #7fd3ff 45%, rgba(80,120,255,.0) 100%); mix-blend-mode: screen; pointer-events: none; }

/* 分屏 */
.shade { position: absolute; inset: 0; }
.shade-left { background: linear-gradient(90deg, rgba(4,6,13,.97) 0%, rgba(4,6,13,.9) 30%, rgba(4,6,13,.45) 46%, rgba(4,6,13,0) 60%); }
.shade-right { background: linear-gradient(270deg, rgba(4,6,13,.97) 0%, rgba(4,6,13,.9) 30%, rgba(4,6,13,.45) 46%, rgba(4,6,13,0) 60%); }
.panel { position: absolute; top: 0; bottom: 0; width: 820px; }
.panel-left { left: 0; } .panel-right { right: 0; }

/* 玻璃卡片 */
.card { background: var(--glass); backdrop-filter: blur(28px) saturate(140%); border: 1px solid var(--line);
  border-radius: 30px; box-shadow: 0 40px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12); overflow: hidden; }
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--cyan), var(--violet) 60%, transparent); opacity: .9; }

.kicker { font-family: var(--en); font-size: 22px; letter-spacing: .32em; font-weight: 600; color: var(--cyan); text-transform: uppercase; }
.kicker .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); margin-right: 14px; vertical-align: 2px; box-shadow: 0 0 16px var(--cyan); }
.title { font-family: "DeYi"; font-size: 84px; line-height: 1.08; letter-spacing: .01em; }
.title.xl { font-size: 128px; }
.title .hl { background: linear-gradient(90deg, #7fe0ff, #a99bff); -webkit-background-clip: text; color: transparent; }
.en { font-family: var(--en); font-weight: 700; letter-spacing: -.01em; }
.glow { text-shadow: 0 0 40px rgba(76,201,255,.45); }

.chip { display: inline-flex; align-items: center; gap: 12px; padding: 12px 24px; border-radius: 999px; font-size: 32px; font-weight: 600;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(16px); white-space: nowrap; }
.chip.accent { background: linear-gradient(90deg, rgba(76,201,255,.24), rgba(155,140,255,.24)); border-color: rgba(140,200,255,.45); }
.chip.mint { background: rgba(62,230,168,.14); border-color: rgba(62,230,168,.5); color: #b9ffe4; }
.chip.red { background: rgba(255,107,122,.14); border-color: rgba(255,107,122,.5); color: #ffd0d6; }
.chip.amber { background: rgba(255,200,90,.14); border-color: rgba(255,200,90,.5); color: #ffe9bd; }

.row { display: flex; align-items: center; gap: 26px; width: 640px; padding: 22px 28px; border-radius: 22px;
  background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.1); }
.row .ib { flex: none; width: 66px; height: 66px; border-radius: 18px; display: grid; place-items: center; font-size: 34px;
  background: linear-gradient(135deg, rgba(76,201,255,.25), rgba(155,140,255,.25)); color: #dff4ff; border: 1px solid rgba(140,200,255,.35); }
.row .tx { font-size: 38px; font-weight: 600; line-height: 1.2; }
.row .tx small { display: block; font-size: 24px; color: var(--mute); font-weight: 500; margin-top: 4px; }

.big-num { font-family: var(--en); font-weight: 800; letter-spacing: -.03em; }

/* 字幕：得意黑 + 黑色半透明底条 */
.subs { position: absolute; left: 0; right: 0; bottom: 62px; display: flex; justify-content: center; z-index: 50; }
.sub { max-width: 1500px; padding: 10px 30px 12px; border-radius: 14px; background: rgba(0,0,0,.58); backdrop-filter: blur(6px); }
.sub span { font-family: "DeYi"; font-size: 58px; line-height: 1.2; color: #fff; letter-spacing: .02em; white-space: nowrap; }

.grain { position: absolute; inset: 0; z-index: 90; opacity: .07; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
.vignette { position: absolute; inset: 0; z-index: 89; pointer-events: none; background: radial-gradient(110% 100% at 50% 45%, transparent 60%, rgba(0,0,0,.38) 100%); }

/* 顶部章节进度 */
.prog { position: absolute; left: 60px; right: 60px; top: 34px; height: 30px; z-index: 60; display: flex; gap: 10px; }
.prog .seg { flex: 1; position: relative; }
.prog .seg .bar { position: absolute; left: 0; right: 0; top: 0; height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
.prog .seg .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--cyan), var(--violet)); }
.prog .seg b { position: absolute; left: 0; top: 12px; font-size: 18px; font-weight: 600; color: rgba(255,255,255,.5); letter-spacing: .08em; }
.prog .seg.on b { color: #fff; }

.browser { border-radius: 18px; overflow: hidden; background: #0d1018; border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 50px 110px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.4); }
.bbar { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #171b26; border-bottom: 1px solid rgba(255,255,255,.08); }
.bbar > i { width: 12px; height: 12px; border-radius: 50%; background: #3a3f4d; }
.bbar > i:nth-child(1) { background: #ff5f57; } .bbar > i:nth-child(2) { background: #febc2e; } .bbar > i:nth-child(3) { background: #28c840; }
.bbar .url { margin-left: 18px; flex: 1; height: 28px; border-radius: 8px; background: rgba(255,255,255,.07); display: flex; align-items: center; gap: 10px;
  padding: 0 14px; font: 500 17px var(--en); color: rgba(255,255,255,.72); white-space: nowrap; overflow: hidden; }
.bbar .url .ico { font-size: 14px; color: var(--mint); }
.bview { position: relative; overflow: hidden; background: #fff; }
.bpage { position: absolute; inset: 0; }
.bpage img { position: absolute; max-width: none; }
.bspot { position: absolute; border: 3px solid var(--cyan); border-radius: 10px; }
.note { padding: 22px 28px; border-radius: 22px; background: rgba(14,18,30,.78); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.14);
  font-size: 34px; font-weight: 600; line-height: 1.4; box-shadow: 0 30px 70px rgba(0,0,0,.45); }
.note .who { font-size: 22px; font-weight: 600; color: var(--cyan); letter-spacing: .06em; margin-bottom: 8px; }
.note.me { background: linear-gradient(135deg, rgba(59,130,246,.85), rgba(109,92,246,.85)); border-color: rgba(160,180,255,.5); }
.note.me .who { color: rgba(255,255,255,.75); }
.note b { color: #9fe8ff; font-weight: 700; }
.typing::after { content: "▍"; color: var(--cyan); margin-left: 2px; }
</style>
</head>
<body>
<div id="stage"><img id="aroll"></div>
<script>window.OVERLAY = location.search.includes('overlay');   // 分轨导出：只渲染包装层（透明底，不含口播和字幕）
if (OVERLAY) document.documentElement.classList.add('overlay');</script>
<script>const PROJ = "{{PROJ_URL}}"; const A = p => PROJ + p;   // comp.js 里引用项目素材：A('assets/official/x.png')</script>
<script src="{{WORK_URL}}clips.js"></script>
<script src="{{WORK_URL}}shots.js"></script>
<script src="{{ENGINE_URL}}lib.js"></script>
<script src="{{PROJ_URL}}comp.js"></script>
<script>AROLL = document.getElementById('aroll'); window.READY = true;</script>
</body></html>
